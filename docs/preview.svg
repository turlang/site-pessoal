<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Preview do Site Pessoal</title><desc id="desc">Site pessoal com texto ajustado para a área segura do GitHub.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset=".58" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity=".45"/></filter><clipPath id="safe"><rect x="70" y="60" width="720" height="760"/></clipPath></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="130" r="330" fill="#38bdf8" opacity=".08"/><circle cx="170" cy="850" r="280" fill="#34d399" opacity=".06"/><g font-family="Arial,Helvetica,sans-serif"><g clip-path="url(#safe)"><text x="90" y="92" fill="#7dd3fc" font-size="27" font-weight="700">EVANDRO RICARDO</text><rect x="90" y="132" width="242" height="44" rx="22" fill="#38bdf8" opacity=".13"/><text x="112" y="161" fill="#bae6fd" font-size="17" font-weight="700">DESENVOLVEDOR WEB</text><text x="90" y="304" fill="#fff" font-size="68" font-weight="700">Experiência que</text><text x="90" y="388" fill="url(#ac)" font-size="68" font-weight="700">vira solução.</text><text x="94" y="458" fill="#cbd5e1" font-size="23">Trajetória profissional, projetos e habilidades</text><text x="94" y="493" fill="#cbd5e1" font-size="23">apresentados com clareza e tecnologia.</text><rect x="92" y="565" width="174" height="54" rx="27" fill="url(#ac)"/><text x="128" y="600" fill="#07151a" font-size="17" font-weight="700">PROJETOS</text><rect x="286" y="565" width="160" height="54" rx="27" fill="#fff" opacity=".08"/><text x="324" y="600" fill="#fff" font-size="17" font-weight="700">SOBRE MIM</text></g><g transform="translate(8