<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Preview real do Site Pessoal</title><desc id="desc">Captura fiel da página pessoal com hero, sobre e projetos.</desc><rect width="1600" height="900" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="70" fill="#0f172a"/><text x="280" y="44" fill="#f8fafc" font-size="22" font-weight="700">Evandro Ricardo</text><g fill="#94a3b8" font-size="17"><text x="1040" y="44">Sobre</text><text x="1125" y="44">Projetos</text><text x="1225" y="44">Habilidades</text></g><rect x="280" y="110" width="1040" height="310" rx="12" fill="#18263a"/><text x="800" y="205" text-anchor="middle" fill="#fff" font-size="47" font-weight="800">Olá, eu sou Evandro Ricardo</text><text x="800" y="260" text-anchor="middle" fill="#cbd5e1" font-size="22">Desenvolvedor Web em início de carreira focado em criar</text><text x="800" y="294" text-anchor="middle" fill="#cbd5e1" font-size="22">soluções limpas e eficientes.</text><rect x="635" y="335" width="145" height="44" rx="6" fill="none" stroke="#475569"/><text x="680" y="363" fill="#fff" font-size="16">GitHub</text><rect x="800" y="335" width="145" height="44" rx="6" fill="none" stroke="#475569"/><text x="842" y="363" fill="#fff" font-size="16">LinkedIn</text><rect x="280" y="455" width="1040" height="185" rx="12" fill="#fff"/><text x="320" y="505" fill="#0f172a" font-size="28" font-weight="700">Sobre Mim</text><rect x="320" y="518" width="50" height="4" rx="2" fill="#38bdf8"/><text x="320" y="558" fill="#334155" font-size="17">Aos 49 anos, decidi transformar a paixão pela tecnologia em profissão. Minha jornada profissional é plural:</text><text x="320" y="588" fill="#334155" font-size="17">administração, atendimento, logística, manutenção de computadores, redes e estudos em Direito.</text><text x="320" y="618" fill="#334155" font-size="17">Hoje aplico essa experiência para resolver problemas complexos com lógica e inteligência emocional.</text><rect x="280" y="675" width="1040" height="195" rx="12" fill="#fff"/><text x="320" y="725" fill="#0f172a" font-size="28" font-weight="700">Meus Projetos</text><rect x="320" y="738" width="50" height="4" rx="2" fill="#38bdf8"/><rect x="320" y="765" width="455" height="82" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="345" y="800" fill="#0f172a" font-size="22" font-weight="700">OrcMestre</text><text x="345" y="828" fill="#64748b" font-size="15">Hub para Comunidade de RPG</text><rect x="675" y="778" width="80" height="25" rx="12" fill="#e0f2fe"/><text x="692" y="796" fill="#0369a1" font-size="12" font-weight="700">Destaque</text><rect x="805" y="765" width="475" height="82" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="830" y="800" fill="#0f172a" font-size="22" font-weight="700">Próximo Projeto</text><text x="830" y="828" fill="#64748b" font-size="15">Nova aplicação em desenvolvimento</text></g></svg>