<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Preview do Site Pessoal de Evandro Ricardo</title><desc id="desc">Site pessoal de desenvolvedor web com apresentação, projetos e habilidades.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset=".58" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="22" stdDeviation="27" flood-color="#000" flood-opacity=".45"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1380" cy="140" r="300" fill="#38bdf8" opacity=".08"/><circle cx="190" cy="840" r="280" fill="#34d399" opacity=".06"/><g font-family="Inter,Arial,sans-serif"><text x="92" y="92" fill="#7dd3fc" font-size="27" font-weight="900">EVANDRO RICARDO</text><rect x="92" y="140" width="245" height="44" rx="22" fill="#38bdf8" opacity=".1" stroke="#38bdf8"/><text x="117" y="170" fill="#bae6fd" font-size="18" font-weight="800">DESENVOLVEDOR WEB</text><text x="92" y="296" fill="#fff" font-size="82" font-weight="900">Experiência para</text><text x="92" y="386" fill="url(#a)" font-size="82" font-weight="900">resolver com tecnologia.</text><text x="96" y="448" fill="#cbd5e1" font-size="25">Uma trajetória plural transformada em lógica, produtos</text><text x="96" y="484" fill="#cbd5e1" font-size="25">digitais e soluções web claras e eficientes.</text><g transform="translate(94 548)"><rect width="180" height="54" rx="27" fill="url(#a)"/><text x="43" y="35" fill="#07151a" font-size="18" font-weight="900">PROJETOS</text><rect x="200" width="160" height="54" rx="27" fill="#fff" opacity=".07" stroke="#38bdf8"/><text x="238" y="35" fill="#fff" font-size="18" font-weight="800">SOBRE MIM</text></g><g transform="tran